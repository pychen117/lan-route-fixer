name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deb:
    name: unit tests + Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper build-essential

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build the package
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../lan-route-fixer_*.deb .
          ls -l lan-route-fixer_*.deb
          sha256sum lan-route-fixer_*.deb

      - name: Attach the .deb to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lan-route-fixer_*.deb