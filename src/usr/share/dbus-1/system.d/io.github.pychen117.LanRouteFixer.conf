<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Access control for the lan-route-fixer control interface.

  The daemon runs as root and repairs the routes of the *configured* targets.
  Letting a local user trigger that reconciliation delegates no privilege to the
  caller - they can achieve the same thing by waiting for the next kernel route
  event - so it needs no PolicyKit prompt. Sending a message *to* the daemon is
  still restricted to the owner of the connection, and only root may own the
  name or replace it.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.pychen117.LanRouteFixer"/>
    <allow send_destination="io.github.pychen117.LanRouteFixer"/>
    <allow receive_sender="io.github.pychen117.LanRouteFixer"/>
  </policy>

  <policy context="default">
    <deny own="io.github.pychen117.LanRouteFixer"/>
    <deny send_destination="io.github.pychen117.LanRouteFixer"/>
    <allow receive_sender="io.github.pychen117.LanRouteFixer"/>
  </policy>
</busconfig>
